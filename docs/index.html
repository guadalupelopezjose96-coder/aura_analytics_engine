  <style>
  body { margin: 0 !important; padding: 0 !important; }
  .main-content, main, .container { max-width: 1200px; margin: 0 auto; }

    :root {
      --bg: #060b16;
      --card: #0c1527;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #00d2ff;
      --green: #10b981;
      --amber: #f59e0b;
      --indigo: #6366f1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 20px 60px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container { max-width: 1180px; margin: 0 auto; }
    .badge-top {
      display: inline-block;
      background: #10b981;
      color: #04130e;
      font-weight: 800;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      letter-spacing: 0.04em;
      margin-bottom: 14px;
    }
    h1 { font-size: 36px; margin: 0 0 10px; letter-spacing: -0.02em; }
    .subtitle { color: var(--muted); font-size: 16px; line-height: 1.6; max-width: 850px; margin-bottom: 26px; }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 24px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 18px;
      font-size: 13px;
      font-weight: 700;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .metric-box {
      background: #081020;
      border: 1px solid #162238;
      border-radius: 10px;
      padding: 18px;
    }
    .metric-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .metric-val { font-size: 28px; font-weight: 800; margin: 8px 0 6px; font-family: monospace; }
    .metric-sub { font-size: 12px; color: #64748b; }
    .worm-box {
      background: #050a14;
      border: 1px solid #0f5132;
      border-radius: 10px;
      padding: 16px;
      font-family: monospace;
      font-size: 12px;
      color: #34d399;
      line-height: 1.65;
      margin-bottom: 26px;
      overflow-x: auto;
    }
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }
    .price-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .price-card.featured { border: 1.5px solid var(--cyan); }
    .price-card.omni { border: 1.5px solid var(--amber); }
    .price-title { font-size: 18px; font-weight: 700; margin: 0 0 12px; line-height: 1.35; }
    .price-amount { font-size: 32px; font-weight: 800; color: #38bdf8; margin-bottom: 14px; }
    .price-card.omni .price-amount { color: var(--amber); }
    .price-amount span { font-size: 14px; color: var(--muted); font-weight: 500; }
    .price-list { margin: 0 0 22px; padding-left: 18px; color: #cbd5e1; font-size: 14px; line-height: 1.65; }
    .price-list li { margin-bottom: 8px; }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #5850ec;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 13px 18px;
      border-radius: 8px;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.92; }
    .audit-banner {
      background: #0c1527;
      border: 1.5px solid var(--amber);
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 28px;
    }
    .btn-amber {
      display: inline-block;
      background: var(--amber);
      color: #060b16;
      font-weight: 800;
      font-size: 14px;
      padding: 11px 20px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 12px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th { border-bottom: 1px solid #334155; color: #38bdf8; padding: 10px 8px; }
    td { border-bottom: 1px solid #1e293b; padding: 10px 8px; color: #cbd5e1; }
    code { background: #0f172a; padding: 2px 6px; border-radius: 4px; color: #38bdf8; font-family: monospace; }
  </style>
