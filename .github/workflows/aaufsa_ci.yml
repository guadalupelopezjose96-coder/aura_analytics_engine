name: AAUFSA Statutory & VPP Compliance CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Rust Stable & Clippy
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy

      - name: Execute 6-Vector Policy-as-Code Audit
        run: |
          chmod +x ./verify_expansion_compliance.sh
          ./verify_expansion_compliance.sh

      - name: Execute 10-Vector AAUFSA & VPP Unit Test Suite
        run: cargo test --release
